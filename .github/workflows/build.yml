name: Build Thanh Nhan Vua EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-all pynput --name ThanhNhanVua main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ThanhNhanVua-Windows-EXE
          path: dist/ThanhNhanVua.exe
          if-no-files-found: error
