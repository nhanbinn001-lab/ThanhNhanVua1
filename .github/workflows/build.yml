
name: Build Thanh Nhan Vua EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --collect-submodules pynput --name ThanhNhanVua main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ThanhNhanVua-Windows-EXE
          path: dist/ThanhNhanVua.exe
